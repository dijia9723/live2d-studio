<style>
  .meteor {
    position: absolute;
    top: var(--y);
    left: var(--x);
    width: clamp(18px, 21vmin, 180px);
    height: 2px;
    border-radius: 50%;
    background: linear-gradient(90deg, transparent, #8573ec45 35%, #8ed8ff 87%, #fff);
    filter: drop-shadow(0 0 4px #86b8ff);
    rotate: 32deg;
    animation: streak var(--period, 5s) linear infinite;
    animation-delay: var(--delay);
  }

  .meteor::after {
    content: '';
    position: absolute;
    right: 0;
    top: -1px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #edfbff;
    box-shadow: 0 0 9px 2px #8ecfffaf;
  }

  @keyframes streak {
    0% { translate: -30vmin -19vmin; opacity: 0; }
    10% { opacity: 1; }
    38%, 100% { translate: 46vmin 29vmin; opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .meteor { animation: none; opacity: 0.55; }
  }
</style>

<style>
  body {
    background:
      radial-gradient(ellipse at 21% 80%, #432a6b 0%, transparent 54%),
      radial-gradient(ellipse at 81% 16%, #16475e, transparent 53%),
      #090c25;
  }

  .stars {
    position: absolute;
    inset: -15%;
    background-image:
      radial-gradient(circle, #d4f5ff 0.8px, transparent 1.45px),
      radial-gradient(circle, #febeeaaf 1px, transparent 1.6px),
      radial-gradient(circle, #b7c6f499 0.4px, transparent 0.9px);
    background-size: 79px 131px, 149px 113px, 37px 57px;
    background-position: 0 0, 45px 33px, 11px 27px;
    animation: travel 42s linear infinite alternate;
  }

  .orbit {
    position: absolute;
    width: 48vmin;
    aspect-ratio: 1;
    right: 15%;
    top: 14%;
    animation: float 12s ease-in-out infinite alternate;
  }

  .planet {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(ellipse at 76% 78%, #111531 14%, transparent 70%),
      repeating-linear-gradient(156deg, transparent 0 7%, #c1d7ff64 9%, #351f6550 13%, transparent 19%),
      linear-gradient(145deg, #a1e1ff, #8174bc 32%, #3f3a78 66%);
    box-shadow: inset 2px 1px 2vmin #a1e1ff68, 0 0 7vmin #7e7dce57;
  }

  .ring {
    position: absolute;
    inset: -35%;
    border-radius: 50%;
    transform: rotate(-20deg) scaleY(0.29);
    background: repeating-radial-gradient(circle, transparent 0 42%, #88bdfa91 43% 45%, #e1c9ffcb 46% 48%, transparent 49% 51%, #99d7ff8c 52% 54%, #f6c9ff 55% 56%, transparent 57% 59%, #d9c3ff7d 60% 62%, transparent 63% 100%);
  }

  .ring.front { clip-path: inset(50% 0 0); }

  @keyframes travel {
    to { transform: translate(8%, 6%); }
  }

  @keyframes float {
    to { transform: translate(-4%, 12%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .stars, .orbit { animation: none; }
  }
</style>
<div class="stars"></div>
<div class="orbit">
  <div class="ring"></div>
  <div class="planet"></div>
  <div class="ring front"></div>
</div>

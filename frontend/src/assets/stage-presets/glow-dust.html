<style>
  .glow {
    position: absolute;
    top: var(--y);
    left: var(--x);
    width: clamp(3px, var(--size), 30px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffef 5%, var(--color, #ffcf8b) 32%, transparent 72%);
    box-shadow: 0 0 2.7vmin var(--color, #ffcf8b);
    animation: rise var(--period, 9s) ease-in-out infinite;
    animation-delay: var(--delay);
  }

  @keyframes rise {
    0% { translate: -2vmin 12vmin; opacity: 0; scale: 0.55; }
    35% { opacity: 0.9; scale: 1; }
    70% { opacity: 0.63; }
    100% { translate: 5vmin -14vmin; opacity: 0; scale: 0.7; }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow { animation: none; opacity: 0.55; }
  }
</style>

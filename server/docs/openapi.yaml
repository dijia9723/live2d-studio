openapi: 3.0.3
info:
  title: Live2D Studio API
  version: 0.1.0
  description: Local Gin API. Write requests require X-Studio-Client 1. SSE streams JSON events.
servers:
  - url: http://127.0.0.1:12393/api/v1
security:
  - StudioClient: []
paths:
  /health:
    get:
      summary: Service health and agent framework
      responses:
        '200': { description: Healthy }
  /characters:
    get:
      summary: List characters and model paths
      responses:
        '200': { description: Character array in data }
  /characters/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    put:
      summary: Update character name, description and system prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, system_prompt]
              properties:
                name: { type: string, maxLength: 100 }
                description: { type: string }
                system_prompt: { type: string, maxLength: 24000 }
      responses:
        '200': { description: Updated character }
        '400': { description: Invalid input }
        '404': { description: Character not found }
  /characters/{id}/actions:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      summary: Read motions and native expressions from the character's actual model3.json
      description: Initial and uploaded models use the same backend model storage. Only existing resource files within the character model directory are returned. Motions use a JSON pair of group and index as their ID, including empty group names. label uses the character's saved custom name; default_label preserves the original name. Unavailable counts distinguish incomplete files from a legitimate empty list.
      responses:
        '200': { description: data contains character_id, model_path, action_names, motions (id/group/index/label/default_label), expressions and moods (id/label/default_label), unavailable_motions and unavailable_expressions }
        '404': { description: Character not found or read failed }
        '422': { description: Model manifest unavailable or invalid }
  /characters/{id}/action-names:
    parameters:
      - $ref: '#/components/parameters/ID'
    put:
      summary: Replace custom motion, expression and mood names for one character
      description: Stores names in character configuration without changing model files or resource IDs. Empty or omitted names restore defaults. Known names for temporarily unavailable resources are retained. Only the naming column is updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_path, action_names]
              properties:
                model_path: { type: string, description: Current model_path from the actions response }
                action_names:
                  type: object
                  properties:
                    motions: { type: object, additionalProperties: { type: string, maxLength: 60 } }
                    expressions: { type: object, additionalProperties: { type: string, maxLength: 60 } }
                    moods: { type: object, additionalProperties: { type: string, maxLength: 60 } }
      responses:
        '200': { description: Updated character including action_names }
        '400': { description: Invalid name, resource ID or stale model_path }
        '404': { description: Character not found or save failed }
        '422': { description: Model manifest unavailable or invalid }
  /characters/import:
    post:
      summary: Import one Cubism model from ZIP (100MB compressed, 200MB expanded)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: Imported character }
        '400': { description: Invalid, unsafe or incomplete archive }
  /characters/{id}/memories:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      summary: List a character's saved memories by most recent update
      responses:
        '200':
          description: CharacterMemory array in data
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/CharacterMemory' }
        '404': { description: Character not found }
    post:
      summary: Save a memory for a character
      description: If the trimmed content is already saved for this character, the existing memory is returned.
      requestBody:
        $ref: '#/components/requestBodies/CharacterMemoryInput'
      responses:
        '200': { $ref: '#/components/responses/SavedCharacterMemory' }
        '400': { description: Invalid memory content }
        '404': { description: Character not found }
        '409': { description: Character has reached the 100-memory limit }
  /characters/{id}/memories/{memoryId}:
    parameters:
      - $ref: '#/components/parameters/ID'
      - name: memoryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Update a character's saved memory
      requestBody:
        $ref: '#/components/requestBodies/CharacterMemoryInput'
      responses:
        '200': { $ref: '#/components/responses/SavedCharacterMemory' }
        '400': { description: Invalid memory content }
        '404': { description: Memory not found for this character }
        '409': { description: Identical content exists in another memory for this character }
    delete:
      summary: Delete a character's saved memory
      responses:
        '200': { description: Deleted }
        '404': { description: Memory not found for this character }
  /conversations:
    get:
      summary: List conversations by most recent activity
      responses:
        '200': { description: Conversation array }
    post:
      summary: Create a conversation for a character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [character_id]
              properties:
                character_id: { type: string }
      responses:
        '200': { description: Created conversation }
        '400': { description: Invalid character }
  /conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    put:
      summary: Rename a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200': { description: Renamed }
        '400': { description: Invalid title }
        '404': { description: Not found }
        '500': { description: Title could not be saved }
    delete:
      summary: Delete a conversation and its messages transactionally
      responses:
        '200': { description: Deleted }
        '404': { description: Not found }
        '409': { description: Conversation currently generating }
  /conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      summary: Read chronological messages including failure and interruption status
      responses:
        '200':
          description: Message array in data
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
        '404': { description: Not found }
    post:
      summary: Send a message and receive Eino streaming output
      description: Disconnect cancels upstream generation. At most one generation per conversation. A tool event includes a ToolRun in its tool field. Updates for the same call share an ID. A stage_action event carries stage_action (character_id, model_path, type motion/expression, id) after server validation; the client checks its current character/model before executing and displays the actual result. The tool result acknowledges dispatch, not successful playback. A character event includes the saved Character in its character field when update_character succeeds; it only modifies the current conversation character. A done event includes the persisted assistant Message and may be followed by an error event when generation failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 32000 }
                image: { type: string, description: Optional PNG/JPEG/WebP base64 data URL, maximum 4MB decoded }
      responses:
        '200':
          description: SSE data lines containing JSON events (user, delta, expression, stage_action, character, tool, done, error)
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                data: {"type":"tool","tool":{"id":"3c944b72-d4d3-4ddb-b256-651e63f53ca1","name":"current_time","status":"running"}}

                data: {"type":"tool","tool":{"id":"3c944b72-d4d3-4ddb-b256-651e63f53ca1","name":"current_time","status":"completed"}}

                data: {"type":"delta","text":"你好"}

        '400': { description: Invalid message or image }
        '404': { description: Not found }
  /settings:
    get:
      summary: Get effective settings, secret-presence flags and environment override names
      responses:
        '200': { description: Settings with blank API keys and llm_profile_saved indicating whether the current service has saved configuration }
    put:
      summary: Save and activate the selected LLM service profile and shared speech settings (blank LLM key preserves only that service's secret)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [llm, speech]
              properties:
                llm: { type: object, description: 'provider (openai/deepseek/ollama/lmstudio; legacy configurations infer their provider from the URL), base_url, api_key, model, temperature, max_tokens, context_messages, tools_enabled. Each provider keeps an independent profile and secret. Ollama accepts its root URL, /api or /v1 and never receives the saved cloud API key.' }
                speech: { type: object, description: mode (browser/api/off), base_url, api_key, asr_model, tts_model, voice, language }
                clear_llm_key: { type: boolean, default: false }
                clear_speech_key: { type: boolean, default: false }
      responses:
        '200': { description: Saved settings, secrets hidden }
        '400': { description: Validation failed }
  /settings/llm/{provider}:
    get:
      summary: Read the saved configuration for one LLM service without activating it
      description: Returns the database profile, or backend defaults only if none exists. Legacy single-profile settings are preserved. Credentials are never returned; has_llm_key reports presence. Environment overrides are not applied to this profile view.
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [openai, deepseek, ollama, lmstudio] }
      responses:
        '200':
          description: LLM profile with its API key blanked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      llm: { type: object }
                      has_llm_key: { type: boolean }
                      saved: { type: boolean }
        '400': { description: Unsupported service }
        '500': { description: Database read failed }
  /settings/test:
    post:
      summary: Test saved effective settings through the actual Eino streaming and tools path
      responses:
        '200': { description: Model connection works }
        '502': { description: Provider failed or timed out }
  /settings/ollama/models:
    post:
      summary: List installed Ollama models from an unsaved service address
      description: Reads the native /api/tags endpoint without credentials. Accepts the service root, /api or /v1, including a reverse proxy prefix. Does not change saved settings. Upstream timeout is 8 seconds and response is limited to 2MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_url]
              properties:
                base_url: { type: string, format: uri, example: 'http://127.0.0.1:11434' }
      responses:
        '200':
          description: data.models contains installed models with name, model, size, modified_at and details (family, parameter_size, quantization_level). Empty installations return an empty array.
        '400': { description: Invalid service address or request body }
        '502': { description: Service unavailable, invalid response or timeout }
  /scene-assets:
    get:
      summary: List local background image and video assets, newest first
      responses:
        '200':
          description: SceneAsset array in data
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SceneAsset' }
    post:
      summary: Upload a local background image or video
      description: Images (PNG/JPEG/WebP/GIF) are limited to 15MiB, videos (MP4/WebM) to 150MiB. Format is checked from content signatures, not the filename or multipart MIME type. Files use UUID names and stay in the local data directory.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: Created SceneAsset in data }
        '400': { description: Missing or unsupported image/video }
        '413': { description: File or multipart body exceeded its size limit }
  /scene-assets/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    delete:
      summary: Delete a local background record and its media file
      responses:
        '200': { description: Asset deleted }
        '404': { description: Asset not found }
  /scene-media/{filename}:
    servers:
      - url: http://127.0.0.1:12393
    parameters:
      - name: filename
        in: path
        required: true
        schema: { type: string, description: Server-generated UUID with a canonical media extension }
    get:
      summary: Read registered local media, with byte-range seeking for videos
      parameters:
        - name: Range
          in: header
          schema: { type: string, example: 'bytes=0-1023' }
      responses:
        '200': { description: Original media bytes and detected Content-Type }
        '206': { description: Requested byte range with Content-Range and Accept-Ranges headers }
        '404': { description: Missing, unregistered or invalid media path }
        '416': { description: Requested byte range cannot be satisfied }
    head:
      summary: Read media type and size headers without downloading the body
      responses:
        '200': { description: Content-Type, Content-Length and Accept-Ranges headers }
        '404': { description: Media not found }
  /speech/transcribe:
    post:
      summary: Transcribe an audio file with configured ASR API (25MB maximum)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: Recognized text in data.text }
        '502': { description: Speech provider failed }
  /speech/synthesize:
    post:
      summary: Synthesize text with configured TTS API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 20000 }
      responses:
        '200':
          description: MP3 audio
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        '502': { description: Speech provider failed }
  /desktop:
    get:
      summary: Check if native desktop controls are available
      responses:
        '200': { description: data.available boolean }
  /desktop/{action}:
    parameters:
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [pet, pin] }
    post:
      summary: Show/hide pet or toggle main window on top
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { description: Window updated }
        '409': { description: Requires desktop build }
components:
  requestBodies:
    CharacterMemoryInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [content]
            properties:
              content: { type: string, minLength: 1, maxLength: 300, description: Memory text with leading and trailing whitespace trimmed before validation }
  responses:
    SavedCharacterMemory:
      description: Saved CharacterMemory in data
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: integer, example: 0 }
              message: { type: string, example: ok }
              data: { $ref: '#/components/schemas/CharacterMemory' }
  schemas:
    CharacterMemory:
      type: object
      required: [id, character_id, content, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        character_id: { type: string }
        content: { type: string, minLength: 1, maxLength: 300 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Message:
      type: object
      required: [id, conversation_id, role, content, status, created_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        image: { type: string }
        status: { type: string, enum: [complete, failed, interrupted] }
        error: { type: string }
        tool_runs:
          type: array
          description: Assistant tool calls with their last persisted status, in call order
          items: { $ref: '#/components/schemas/ToolRun' }
        created_at: { type: string, format: date-time }
    ToolRun:
      type: object
      description: Local tool trace containing the call ID, tool name and status. Tool arguments and results are omitted.
      required: [id, name, status]
      properties:
        id: { type: string, format: uuid, description: Locally generated call ID }
        name: { type: string, description: Registered tool name or unknown_tool }
        status: { type: string, enum: [running, completed, failed] }
    SceneAsset:
      type: object
      required: [id, name, kind, mime_type, size, url, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: Original display name, never used as a filesystem path }
        kind: { type: string, enum: [image, video] }
        mime_type: { type: string, enum: [image/png, image/jpeg, image/webp, image/gif, video/mp4, video/webm] }
        size: { type: integer, format: int64, description: Original file size in bytes }
        url: { type: string, example: '/scene-media/00000000-0000-0000-0000-000000000000.mp4' }
        created_at: { type: string, format: date-time }
  securitySchemes:
    StudioClient:
      type: apiKey
      in: header
      name: X-Studio-Client
      description: Value must be 1 for writes. This is a local client marker, not authentication.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }

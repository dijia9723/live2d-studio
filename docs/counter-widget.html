<!-- 在组件的计数绑定中，将 count 和 second 分别绑定到两项计数数据。 -->
<style>
  .stats {
    display: flex;
    gap: 12px;
    height: 100%;
    color: #514065;
  }
  .stat {
    flex: 1;
    min-width: 0;
    padding: 14px 20px;
    border: 1px solid #ffffffb0;
    border-radius: 16px;
    background: #fffdf4ed;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    box-shadow: 0 5px 20px #3f235512;
  }
  .stat:last-child {
    background: #e7f5edf0;
    color: #426e5a;
  }
  small { font-size: 13px; opacity: .75; }
  strong { font-size: clamp(22px, 6vw, 38px); font-weight: 750; font-variant-numeric: tabular-nums; }
</style>
<div class="stats">
  <div class="stat"><small>♥ {{count.label}}</small><strong>{{count}}</strong></div>
  <div class="stat"><small>✦ {{second.label}}</small><strong>{{second}}</strong></div>
</div>
